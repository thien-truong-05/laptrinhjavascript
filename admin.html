<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Trị - ProSneaker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }</script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">
<div id="site-header"></div>

<main id="adminRoot" class="hidden flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 pb-4 border-b border-slate-200 gap-4">
        <div>
            <span class="text-xs font-bold uppercase tracking-widest text-orange-500 bg-orange-50 px-2.5 py-1 rounded-md border border-orange-200">Hệ Thống Quản Trị</span>
            <h1 class="text-2xl sm:text-3xl font-black text-slate-900 mt-1">Bảng Điều Khiển Admin</h1>
        </div>
        <button onclick="openProductModal(null)" class="btn-primary px-4 py-2.5 shadow-md flex items-center gap-2 text-sm self-start md:self-auto"><i class="fa-solid fa-plus"></i> Thêm Sản Phẩm Mới</button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
        <div class="bg-white p-5 rounded-2xl border border-slate-200 flex items-center gap-4"><div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-sack-dollar"></i></div><div><p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Doanh thu (hoàn thành)</p><h3 id="mRevenue" class="text-xl font-black mt-0.5">0đ</h3></div></div>
        <div class="bg-white p-5 rounded-2xl border border-slate-200 flex items-center gap-4"><div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-cart-flatbed"></i></div><div><p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Đơn hàng <span id="mPending" class="text-amber-600 normal-case"></span></p><h3 id="mOrders" class="text-xl font-black mt-0.5">0</h3></div></div>
        <div class="bg-white p-5 rounded-2xl border border-slate-200 flex items-center gap-4"><div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-shoe-prints"></i></div><div><p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Sản phẩm</p><h3 id="mProducts" class="text-xl font-black mt-0.5">0</h3></div></div>
        <div class="bg-white p-5 rounded-2xl border border-slate-200 flex items-center gap-4"><div class="w-12 h-12 bg-purple-100 text-purple-600 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-users"></i></div><div><p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Người dùng</p><h3 id="mUsers" class="text-xl font-black mt-0.5">0</h3></div></div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
        <div class="flex border-b border-slate-200 bg-slate-50/50 overflow-x-auto">
            <button data-tab="products" class="atab px-5 py-3.5 text-sm font-bold border-b-2 whitespace-nowrap flex items-center gap-2"><i class="fa-solid fa-boxes-stacked"></i> Sản Phẩm</button>
            <button data-tab="orders" class="atab px-5 py-3.5 text-sm font-bold border-b-2 whitespace-nowrap flex items-center gap-2"><i class="fa-solid fa-receipt"></i> Đơn Hàng</button>
            <button data-tab="users" class="atab px-5 py-3.5 text-sm font-bold border-b-2 whitespace-nowrap flex items-center gap-2"><i class="fa-solid fa-users-gear"></i> Người Dùng</button>
            <button data-tab="messages" class="atab px-5 py-3.5 text-sm font-bold border-b-2 whitespace-nowrap flex items-center gap-2"><i class="fa-solid fa-envelope"></i> Liên Hệ <span id="msgBadge" class="hidden bg-orange-500 text-white text-[10px] px-1.5 rounded-full"></span></button>
        </div>

        <div id="atab-products" class="atab-panel p-5 overflow-x-auto">
            <input id="prodSearch" oninput="renderProducts()" placeholder="Tìm sản phẩm..." class="field !rounded-lg !py-2 max-w-xs mb-4">
            <table class="w-full text-left border-collapse min-w-[700px]">
                <thead><tr class="border-b border-slate-200 text-xs uppercase font-bold text-slate-400 bg-slate-50"><th class="py-3 px-4">Sản phẩm</th><th class="py-3 px-4">Thương hiệu</th><th class="py-3 px-4">Giá</th><th class="py-3 px-4">Size</th><th class="py-3 px-4">Đánh giá</th><th class="py-3 px-4 text-right">Hành động</th></tr></thead>
                <tbody id="tbProducts" class="divide-y divide-slate-100 text-sm"></tbody>
            </table>
        </div>
        <div id="atab-orders" class="atab-panel hidden p-5 overflow-x-auto">
            <select id="orderFilter" onchange="renderOrders()" class="field !rounded-lg !py-2 max-w-[200px] mb-4"><option value="">Tất cả trạng thái</option><option value="PENDING">Chờ xử lý</option><option value="SHIPPING">Đang giao</option><option value="COMPLETED">Hoàn thành</option><option value="CANCELLED">Đã hủy</option></select>
            <table class="w-full text-left border-collapse min-w-[800px]">
                <thead><tr class="border-b border-slate-200 text-xs uppercase font-bold text-slate-400 bg-slate-50"><th class="py-3 px-4">Mã đơn</th><th class="py-3 px-4">Khách hàng</th><th class="py-3 px-4">SĐT</th><th class="py-3 px-4">Tổng tiền</th><th class="py-3 px-4">Thanh toán</th><th class="py-3 px-4">Trạng thái</th><th class="py-3 px-4 text-right">Cập nhật</th></tr></thead>
                <tbody id="tbOrders" class="divide-y divide-slate-100 text-sm"></tbody>
            </table>
        </div>
        <div id="atab-users" class="atab-panel hidden p-5 overflow-x-auto">
            <table class="w-full text-left border-collapse min-w-[600px]">
                <thead><tr class="border-b border-slate-200 text-xs uppercase font-bold text-slate-400 bg-slate-50"><th class="py-3 px-4">Họ &amp; tên</th><th class="py-3 px-4">Email</th><th class="py-3 px-4">Vai trò</th><th class="py-3 px-4">Ngày tạo</th><th class="py-3 px-4 text-right">Hành động</th></tr></thead>
                <tbody id="tbUsers" class="divide-y divide-slate-100 text-sm"></tbody>
            </table>
        </div>
        <div id="atab-messages" class="atab-panel hidden p-5">
            <div id="msgList" class="space-y-3"></div>
        </div>
    </div>
</main>

<!-- Modal: product -->
<div id="productModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm hidden">
    <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        <button onclick="closeModal('productModal')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        <h3 id="pmTitle" class="text-xl font-bold mb-4 pb-2 border-b border-slate-200"></h3>
        <form id="productForm" class="space-y-4 text-xs">
            <input type="hidden" id="fId">
            <div><label class="block font-bold mb-1">Tên giày *</label><input id="fName" required class="field !rounded-lg"></div>
            <div class="grid grid-cols-2 gap-3">
                <div><label class="block font-bold mb-1">Thương hiệu *</label><input id="fBrand" list="brandList" required class="field !rounded-lg"><datalist id="brandList"></datalist></div>
                <div><label class="block font-bold mb-1">Giá bán (VNĐ) *</label><input type="number" id="fPrice" required min="100000" step="1000" class="field !rounded-lg"></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div><label class="block font-bold mb-1">Giá gốc (VNĐ)</label><input type="number" id="fOld" class="field !rounded-lg"></div>
                <div><label class="block font-bold mb-1">Đánh giá (0-5)</label><input type="number" id="fRating" min="0" max="5" step="0.1" value="5" class="field !rounded-lg"></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div><label class="block font-bold mb-1">Sizes (cách nhau dấu phẩy) *</label><input id="fSizes" required placeholder="39, 40, 41" class="field !rounded-lg"></div>
                <div><label class="block font-bold mb-1">Màu sắc (cách nhau dấu phẩy)</label><input id="fColors" placeholder="Đen, Trắng/Xám" class="field !rounded-lg"></div>
            </div>
            <div><label class="block font-bold mb-1">Ảnh chính (URL) *</label><input type="url" id="fImage" required class="field !rounded-lg"></div>
            <div><label class="block font-bold mb-1">Ảnh phụ (URL, mỗi dòng một ảnh)</label><textarea id="fThumbs" rows="2" class="field !rounded-lg"></textarea></div>
            <div><label class="block font-bold mb-1">Mô tả</label><textarea id="fDesc" rows="3" class="field !rounded-lg"></textarea></div>
            <button class="btn-primary w-full py-3 text-sm shadow-md">LƯU SẢN PHẨM</button>
        </form>
    </div>
</div>

<!-- Modal: order detail -->
<div id="orderModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
        <button onclick="closeModal('orderModal')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        <div id="orderDetail"></div>
    </div>
</div>

<div id="site-footer"></div>
<script src="app.js"></script>
<script src="admin.js"></script>
</body>
</html>
