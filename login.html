<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - ProSneaker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }</script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">
<div id="site-header"></div>

<main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 sm:p-8 shadow-xl border border-slate-100 fade-in">
        <div class="text-center mb-6">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-r from-orange-500 to-amber-500 text-white flex items-center justify-center text-xl shadow-lg shadow-orange-500/30 mb-3"><i class="fa-solid fa-right-to-bracket"></i></div>
            <h1 class="text-2xl font-extrabold">Đăng Nhập</h1>
            <p class="text-xs text-slate-500 mt-1">Chào mừng bạn quay lại ProSneaker</p>
        </div>
        <p id="needNotice" class="hidden mb-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-3 text-xs font-medium"><i class="fa-solid fa-circle-info mr-1"></i>Vui lòng đăng nhập hoặc đăng ký tài khoản để tiếp tục đặt hàng. Giỏ hàng của bạn vẫn được giữ nguyên.</p>
        <form id="loginForm" class="space-y-4">
            <div><label class="block text-xs font-bold text-slate-700 uppercase mb-1">Email</label><input type="email" id="loginEmail" required placeholder="email@example.com" class="field"></div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Mật khẩu</label>
                <div class="relative"><input type="password" id="loginPassword" required placeholder="••••••••" class="field pr-10">
                <button type="button" onclick="togglePw('loginPassword', this)" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"><i class="fa-regular fa-eye"></i></button></div>
            </div>
            <p id="loginErr" class="hidden text-xs text-red-500 font-medium"><i class="fa-solid fa-circle-exclamation mr-1"></i>Email hoặc mật khẩu không chính xác!</p>
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs text-slate-500 space-y-1">
                <p class="font-bold text-slate-700">Tài khoản thử nghiệm:</p>
                <p>• Admin: <button type="button" onclick="fill('admin@sport.com','admin123')" class="font-bold text-orange-600 hover:underline">admin@sport.com / admin123</button></p>
                <p>• User: <button type="button" onclick="fill('user@sport.com','user123')" class="font-bold text-orange-600 hover:underline">user@sport.com / user123</button></p>
            </div>
            <button type="submit" class="btn-dark w-full py-3 text-sm shadow-md">ĐĂNG NHẬP</button>
        </form>
        <p class="text-center text-xs text-slate-500 mt-5">Chưa có tài khoản? <a id="toRegister" href="register.html" class="font-bold text-orange-600 hover:underline">Đăng ký ngay</a></p>
    </div>
</main>

<div id="site-footer"></div>
<script src="app.js"></script>
<script>
    const redirect = safeRedirect(qs('redirect'));
    if (currentUser) location.replace(redirect);
    const needOrder = qs('need') === 'order';
    if (needOrder) document.getElementById('needNotice').classList.remove('hidden');
    document.getElementById('toRegister').href = 'register.html?redirect=' + encodeURIComponent(redirect) + (needOrder ? '&need=order' : '');
    function fill(e, p) { document.getElementById('loginEmail').value = e; document.getElementById('loginPassword').value = p; }
    function togglePw(id, btn) {
        const i = document.getElementById(id); const show = i.type === 'password';
        i.type = show ? 'text' : 'password'; btn.innerHTML = `<i class="fa-regular fa-eye${show ? '-slash' : ''}"></i>`;
    }
    document.getElementById('loginForm').onsubmit = e => {
        e.preventDefault();
        const ok = login(document.getElementById('loginEmail').value.trim(), document.getElementById('loginPassword').value);
        if (ok) location.href = (currentUser.role === 'admin' && redirect === 'index.html') ? 'admin.html' : redirect;
        else document.getElementById('loginErr').classList.remove('hidden');
    };
</script>
</body>
</html>
