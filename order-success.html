<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Hàng Thành Công - ProSneaker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] } } } }</script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">
<div id="site-header"></div>

<main class="flex-grow max-w-xl mx-auto px-4 py-12 w-full">
    <div id="box" class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 text-center shadow-sm fade-in"></div>
</main>

<div id="site-footer"></div>
<script src="app.js"></script>
<script>
    if (requireLogin()) {
        const o = orders.find(x => x.id === qs('id') && (x.userEmail === currentUser.email || currentUser.role === 'admin'));
        const box = document.getElementById('box');
        if (!o) {
            box.innerHTML = `<div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-4"><i class="fa-solid fa-circle-question"></i></div>
                <h1 class="text-xl font-extrabold">Không tìm thấy đơn hàng</h1>
                <a href="account.html#orders" class="btn-dark inline-block px-6 py-3 mt-5 text-sm">Xem đơn hàng của tôi</a>`;
        } else {
            box.innerHTML = `
                <div class="w-16 h-16 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 border-4 border-emerald-50"><i class="fa-solid fa-check"></i></div>
                <h1 class="text-2xl font-extrabold">Đặt Hàng Thành Công!</h1>
                <p class="text-slate-500 text-xs mt-1">Cảm ơn bạn đã mua sắm tại ProSneaker. Chúng tôi sẽ liên hệ xác nhận đơn sớm nhất.</p>
                <div class="bg-slate-50 rounded-xl p-4 my-5 text-left text-xs space-y-2 border border-slate-200">
                    <div class="flex justify-between pb-2 border-b border-slate-200"><span class="text-slate-500">Mã đơn hàng</span><b class="text-orange-600">${esc(o.id)}</b></div>
                    <div class="flex justify-between gap-4"><span class="text-slate-500">Người nhận</span><b>${esc(o.customerName)}</b></div>
                    <div class="flex justify-between gap-4"><span class="text-slate-500">Số điện thoại</span><b>${esc(o.phone)}</b></div>
                    <div class="flex justify-between gap-4"><span class="text-slate-500 whitespace-nowrap">Địa chỉ giao</span><b class="text-right">${esc(o.address)}</b></div>
                    <div class="flex justify-between gap-4"><span class="text-slate-500">Thanh toán</span><b>${o.payment === 'BANK' ? 'Chuyển khoản' : 'COD'}</b></div>
                    <div class="pt-2 border-t border-slate-200 space-y-1">
                        ${(o.items || []).map(i => `<div class="flex justify-between gap-3"><span class="text-slate-600">${esc(i.name)} (${esc(i.size)}) x${i.qty}</span><span class="font-semibold">${formatVND(i.price * i.qty)}</span></div>`).join('')}
                    </div>
                    <div class="flex justify-between pt-2 border-t border-slate-200 text-sm font-bold"><span>Tổng thanh toán</span><span class="text-orange-600">${formatVND(o.total)}</span></div>
                </div>
                ${o.payment === 'BANK' ? `<div class="text-left text-xs bg-blue-50 border border-blue-200 text-blue-800 rounded-xl p-4 mb-5">
                    <p class="font-bold mb-1"><i class="fa-solid fa-building-columns mr-1"></i>Thông tin chuyển khoản</p>
                    <p>Ngân hàng: <b>Vietcombank</b> · STK: <b>0123456789</b></p><p>Chủ TK: <b>CONG TY PROSNEAKER</b></p>
                    <p>Nội dung: <b>${esc(o.id)} ${esc(o.phone)}</b></p></div>` : ''}
                <div class="flex flex-col sm:flex-row gap-3">
                    <a href="account.html#orders" class="flex-1 btn-dark py-3 text-sm">Xem đơn hàng</a>
                    <a href="products.html" class="flex-1 btn-primary py-3 text-sm">Tiếp tục mua sắm</a>
                </div>`;
        }
    }
</script>
</body>
</html>
